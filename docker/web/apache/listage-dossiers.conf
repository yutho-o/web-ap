# Reactive le "directory listing" (Options -Indexes est impose par
# defaut par l'image officielle via docker-php.conf). C'est utile en
# contexte pedagogique : ca permet a l'etudiant de voir le contenu d'un
# dossier quand il n'y a pas de index.php/index.html, par exemple pour
# verifier qu'un fichier uploade est bien arrive au bon endroit.
<Directory /var/www/html>
	Options +Indexes
</Directory>

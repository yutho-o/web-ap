; Reglages du debogueur Xdebug.
;
; Sens de la connexion : c'est le serveur (dans le conteneur) qui appelle
; l'editeur, et non l'inverse. « client_host » designe donc la machine ou
; tourne VS Code, vue depuis le conteneur, et « client_port » le port sur
; lequel VS Code ecoute.

; debug   : le debogage pas a pas (points d'arret).
; develop : des messages d'erreur et des var_dump plus lisibles.
xdebug.mode=debug,develop

; Chaque page demandee tente de joindre l'editeur. Il n'y a donc rien de
; special a faire dans l'URL : poser un point d'arret et recharger suffit.
; Si VS Code n'ecoute pas, la tentative echoue en silence et la page
; s'affiche normalement.
xdebug.start_with_request=yes

; « host.docker.internal » est le nom de la machine hote vu du conteneur.
; Il est fourni par Docker Desktop, et par la ligne « extra_hosts » du
; fichier docker-compose.yml pour les autres installations.
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=VSCODE

; Delai maximal pour joindre l'editeur, en millisecondes. Volontairement
; court : quand le debogueur n'est pas lance, les pages ne doivent pas
; ralentir.
xdebug.connect_timeout_ms=200

; Journal de Xdebug, a consulter en cas de probleme :
;   docker compose exec web cat /tmp/xdebug.log
; log_level=7 (verbeux) aide a voir pourquoi une connexion echoue.
xdebug.log=/tmp/xdebug.log
xdebug.log_level=0

; Sur les pages d'erreur (mode develop ci-dessus), Xdebug transforme le
; nom de chaque fichier en lien cliquable, cense ouvrir l'editeur a la
; bonne ligne. %f et %l sont remplaces par Xdebug avec le chemin du
; fichier et le numero de ligne.
;
; Le chemin fourni par %f est celui vu par le serveur, DANS le conteneur
; (/var/www/html/...), pas celui du poste : un lien direct
; « vscode://file/%f:%l » ouvrirait donc un fichier qui n'existe pas chez
; l'etudiant. Le lien pointe a la place vers une page du projet qui
; traduit ce chemin avant de rediriger vers VS Code :
; cours/verif/ouvrir-editeur.php (voir ce fichier, et
; docker-compose.yml pour HOST_COURS_DIR).
; Entre guillemets : sans eux, PHP interprete le « & » comme un
; operateur (comme dans error_reporting = E_ALL & ~E_NOTICE) et refuse
; de demarrer.
xdebug.file_link_format="http://localhost:8080/verif/ouvrir-editeur.php?f=%f&l=%l"
